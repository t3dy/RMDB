{{ define "main" }}
<!-- Leaflet CSS (local) -->
<link rel="stylesheet" href="/css/leaflet.css" />
<link rel="stylesheet" href="/css/MarkerCluster.css" />
<link rel="stylesheet" href="/css/MarkerCluster.Default.css" />

<style>
  .timeline-page { display: flex; flex-direction: column; height: calc(100vh - 120px); }
  .timeline-header { padding: 0.75rem 1.25rem; background: var(--bg-secondary, #f8f5f0); border-bottom: 1px solid #d6c8b0; flex-shrink: 0; }
  .timeline-header h1 { margin: 0 0 0.25rem; font-size: 1.3rem; color: #3d2b1f; }
  .timeline-controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
  .era-btns { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .era-btn {
    padding: 0.25rem 0.65rem; border: 1px solid #b8a88a; border-radius: 3px;
    background: #fff; cursor: pointer; font-size: 0.78rem; color: #5a3e28;
    transition: background 0.15s;
  }
  .era-btn.active { background: #5a3e28; color: #fff; border-color: #5a3e28; }
  .era-btn:hover:not(.active) { background: #f0e8d8; }
  .year-range-label { font-size: 0.8rem; color: #6b5744; white-space: nowrap; }
  #map { flex: 1; }
  .legend {
    background: rgba(255,255,255,0.95); padding: 0.65rem 0.85rem;
    border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.2);
    font-size: 0.75rem; line-height: 1.8; min-width: 160px;
  }
  .legend-title { font-weight: 700; margin-bottom: 0.3rem; color: #3d2b1f; }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.25); }
  .event-count { font-size: 0.72rem; color: #888; margin-left: 0.25rem; }
  .popup-year { font-size: 0.78rem; color: #8b6e52; margin-bottom: 0.2rem; }
  .popup-title { font-weight: 700; font-size: 0.92rem; color: #2c1a0e; margin-bottom: 0.35rem; line-height: 1.3; }
  .popup-location { font-size: 0.75rem; color: #7a6652; margin-bottom: 0.35rem; }
  .popup-type { display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.45rem;
    border-radius: 2px; color: #fff; margin-bottom: 0.45rem; }
  .popup-desc { font-size: 0.8rem; color: #444; line-height: 1.5; max-height: 160px; overflow-y: auto; }
  .popup-figures { font-size: 0.75rem; color: #6b5744; margin-top: 0.4rem; }
  .leaflet-popup-content { margin: 10px 14px; min-width: 240px; max-width: 320px; }
</style>

<div class="timeline-page">
  <div class="timeline-header">
    <h1>{{ .Title }}</h1>
    <div class="timeline-controls">
      <div class="era-btns">
        <button class="era-btn active" data-min="-400" data-max="2030">All eras</button>
        <button class="era-btn" data-min="-400" data-max="600">Ancient</button>
        <button class="era-btn" data-min="600" data-max="1400">Medieval</button>
        <button class="era-btn" data-min="1400" data-max="1620">Renaissance</button>
        <button class="era-btn" data-min="1600" data-max="1720">Early Modern</button>
        <button class="era-btn" data-min="1900" data-max="2030">Scholarship</button>
      </div>
      <span class="year-range-label" id="year-label">Showing all 135 events</span>
    </div>
  </div>
  <div id="map"></div>
</div>

<!-- Leaflet JS (local) -->
<script src="/js/leaflet.js"></script>
<script src="/js/leaflet.markercluster.js"></script>

<script>
const TYPE_COLORS = {
  BIOGRAPHY:    '#6366f1',
  PUBLICATION:  '#0ea5e9',
  INSTITUTION:  '#10b981',
  TRANSLATION:  '#f59e0b',
  TRIAL:        '#ef4444',
  POLITICAL:    '#8b5cf6',
  SCHOLARSHIP:  '#ec4899',
  DISCOVERY:    '#14b8a6',
  OTHER:        '#94a3b8',
};

const TYPE_LABELS = {
  BIOGRAPHY:    'Biography',
  PUBLICATION:  'Publication',
  INSTITUTION:  'Institution',
  TRANSLATION:  'Translation',
  TRIAL:        'Trial / Condemnation',
  POLITICAL:    'Political event',
  SCHOLARSHIP:  'Scholarship',
  DISCOVERY:    'Discovery / Investigation',
  OTHER:        'Other',
};

function yearLabel(y) {
  return y < 0 ? `${Math.abs(y)} BCE` : `${y} CE`;
}

function makeCircleIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14">
    <circle cx="7" cy="7" r="6" fill="${color}" stroke="white" stroke-width="1.5"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    popupAnchor: [0, -9],
  });
}

const map = L.map('map', { zoomControl: true }).setView([42, 18], 4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18,
}).addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<div class="legend-title">Event type</div>' +
    Object.entries(TYPE_LABELS).map(([k, v]) =>
      `<div class="legend-item"><span class="legend-dot" style="background:${TYPE_COLORS[k]}"></span>${v}</div>`
    ).join('');
  return div;
};
legend.addTo(map);

let allEvents = [];
let clusterGroup = null;

function renderMarkers(events) {
  if (clusterGroup) map.removeLayer(clusterGroup);
  clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40, disableClusteringAtZoom: 7 });

  events.forEach(ev => {
    if (ev.lat == null || ev.lon == null) return;
    const color = TYPE_COLORS[ev.event_type] || TYPE_COLORS.OTHER;
    const marker = L.marker([ev.lat, ev.lon], { icon: makeCircleIcon(color) });

    const yearStr = ev.year_end
      ? `${yearLabel(ev.year)} – ${yearLabel(ev.year_end)}`
      : yearLabel(ev.year);
    const figStr = ev.figures && ev.figures.length
      ? `<div class="popup-figures">Figures: ${ev.figures.join(', ')}</div>` : '';
    const typeLabel = TYPE_LABELS[ev.event_type] || ev.event_type;

    marker.bindPopup(`
      <div class="popup-year">${yearStr}</div>
      <div class="popup-title">${ev.title}</div>
      <div class="popup-location">📍 ${ev.location_name}</div>
      <span class="popup-type" style="background:${color}">${typeLabel}</span>
      <div class="popup-desc">${ev.description || ''}</div>
      ${figStr}
    `);
    clusterGroup.addLayer(marker);
  });

  map.addLayer(clusterGroup);
  document.getElementById('year-label').textContent =
    `Showing ${events.length} event${events.length !== 1 ? 's' : ''}`;
}

function filterAndRender(minYear, maxYear) {
  const filtered = allEvents.filter(e => e.year >= minYear && e.year <= maxYear);
  renderMarkers(filtered);
}

// Era buttons
document.querySelectorAll('.era-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    filterAndRender(Number(this.dataset.min), Number(this.dataset.max));
  });
});

fetch('/data/timeline.json')
  .then(r => r.json())
  .then(data => {
    allEvents = data;
    renderMarkers(data);
  })
  .catch(err => console.error('Failed to load timeline data:', err));
</script>
{{ end }}
